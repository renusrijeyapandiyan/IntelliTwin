# Render Blueprint for IntelliTwin (demo deployment).
# Before "New > Blueprint": create the environment group "intellitwin-secrets" in the Render dashboard (see DEPLOY_RENDER.md).
# If a service name is already taken on Render, change the name here AND the matching URLs below (use the same prefix everywhere).
services:
  # ---------- Dashboard (React, static, free, never sleeps) ----------
  - type: web
    name: intellitwin-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://intellitwin-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------- Backend (Spring Boot) ----------
  - type: web
    name: intellitwin-api
    runtime: docker
    plan: free            # use "starter" ($7/month) for a smoother demo: free has 512 MB RAM and sleeps after 15 idle minutes
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: intellitwin-secrets
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx300m -Xss512k -XX:+UseSerialGC
      - key: AI_SERVICE_URL
        value: https://intellitwin-ai.onrender.com
      - key: SIMULATOR_URL
        value: https://intellitwin-sim.onrender.com
      - key: CORS_ORIGINS
        value: https://intellitwin-web.onrender.com
      - key: AI_TIMEOUT_MS
        value: "6000"

  # ---------- AI service (FastAPI + scikit-learn; model is trained during the image build) ----------
  - type: web
    name: intellitwin-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: intellitwin-secrets

  # ---------- Sensor simulator (+ control API) ----------
  - type: web
    name: intellitwin-sim
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./simulator/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - fromGroup: intellitwin-secrets
      - key: BACKEND_URL
        value: https://intellitwin-api.onrender.com
      - key: SIM_SEED
        value: "42"
